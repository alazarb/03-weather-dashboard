<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Weather Dashboard</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <main class="container">

        <header class="header">

            <h1>🌤️ Weather Dashboard</h1>

            <p>
                Search for the current weather anywhere in the world.
            </p>

        </header>


        <form id="searchForm" class="search-form">

            <input
                type="text"
                id="cityInput"
                placeholder="Enter a city..."
                autocomplete="off"
                required
            >

            <button type="submit">
                Search
            </button>

        </form>


        <div class="controls">

            <button
                id="celsiusButton"
                class="unit-button active"
                type="button"
            >
                °C
            </button>

            <button
                id="fahrenheitButton"
                class="unit-button"
                type="button"
            >
                °F
            </button>

        </div>


        <div id="loading" class="loading hidden">

            <div class="spinner"></div>

            <p>Loading weather...</p>

        </div>


        <div id="errorMessage" class="error hidden"></div>


        <section id="weatherCard" class="weather-card hidden">

            <div class="weather-top">

                <div>

                    <h2 id="cityName">
                        --
                    </h2>

                    <p id="description">
                        --
                    </p>

                </div>

                <img
                    id="weatherIcon"
                    src=""
                    alt="Weather icon"
                >

            </div>


            <div class="temperature-container">

                <span id="temperature">
                    --°C
                </span>

            </div>


            <div class="weather-details">

                <div class="detail">

                    <span class="detail-icon">🌡️</span>

                    <div>

                        <p>Feels Like</p>

                        <strong id="feelsLike">
                            --°C
                        </strong>

                    </div>

                </div>


                <div class="detail">

                    <span class="detail-icon">💧</span>

                    <div>

                        <p>Humidity</p>

                        <strong id="humidity">
                            --%
                        </strong>

                    </div>

                </div>


                <div class="detail">

                    <span class="detail-icon">💨</span>

                    <div>

                        <p>Wind</p>

                        <strong id="wind">
                            -- m/s
                        </strong>

                    </div>

                </div>


                <div class="detail">

                    <span class="detail-icon">🔽</span>

                    <div>

                        <p>Pressure</p>

                        <strong id="pressure">
                            -- hPa
                        </strong>

                    </div>

                </div>

            </div>

        </section>


        <footer>

            <p>
                Weather data provided by OpenWeatherMap
            </p>

        </footer>

    </main>


    <script src="script.js"></script>

</body>

</html>
